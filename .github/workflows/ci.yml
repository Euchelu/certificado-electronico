name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build y tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["11", "17"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar, ejecutar tests y empaquetar el WAR
        run: mvn -B verify

      - name: Guardar el WAR generado
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: certificado-electronico-war
          path: target/*.war
